[package]
name = "testpapers-desktop"
version = "0.1.0"
description = "Local-first TestPapers Desktop shell"
authors = ["Clearders"]
edition = "2021"
rust-version = "1.94.1"

[lib]
name = "testpapers_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "=2.11.5", features = ["tray-icon"] }
tauri-plugin-dialog = "=2.7.2"

[dev-dependencies]
tempfile = "3"
