[package]
name = "testpapers-desktop"
version = "0.1.0"
description = "Local-first TestPapers Desktop shell"
authors = ["Clearders"]
edition = "2021"
rust-version = "1.94.1"

[lib]
name = "testpapers_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
age = { version = "=0.12.1", default-features = false }
csv = "1"
fs2 = "0.4.3"
keyring = { version = "=4.1.6", default-features = false, features = ["v1"] }
rusqlite = { version = "0.37", features = ["backup", "bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tauri = { version = "=2.11.5", features = ["tray-icon"] }
tauri-plugin-dialog = "=2.7.2"
tauri-plugin-single-instance = "=2.4.3"
testpapers-cloud-api = { path = "../contracts/cloud-api-rust", default-features = false, features = ["rustls"] }
tokio = { version = "1", features = ["rt-multi-thread"] }
uuid = { version = "=1.24.0", features = ["serde", "v7"] }

[dev-dependencies]
tempfile = "3"
