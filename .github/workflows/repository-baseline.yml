name: Repository Baseline

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: repository-baseline-${{ github.ref }}
  cancel-in-progress: true

jobs:
  baseline:
    name: Repository baseline
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate repository governance
        run: python scripts/check_repository_baseline.py --repository TestPapers-Desktop

      - name: Validate environment contract
        run: |
          python scripts/check_environment_contract.py
          python -m unittest tests/test_environment_contract.py
